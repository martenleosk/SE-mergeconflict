<!DOCTYPE html>
<html>
<head>
<title>Marie Ilutuba</title>
<style>
.carousel {
  position: relative;
  width: 200px;
  max-width: 100%;
  margin: auto;
  overflow: hidden;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.carousel-inner {
  display: flex;
  transition: transform 0.5s ease-in-out;
}

.carousel-item {
  min-width: 100%;
  box-sizing: border-box;
}

.carousel-item img {
  width: 100%;
  display: block;
}

.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0, 0, 0, 0.5);
  color: white;
  border: none;
  font-size: 18px;
  padding: 12px 16px;
  cursor: pointer;
  border-radius: 4px;
  user-select: none;
}

.carousel-btn:hover {
  background-color: rgba(0, 0, 0, 0.8);
}

.prev {
  left: 10px;
}

.next {
  right: 10px;
}

.split {
  height: 100%;
  width: 50%;
  position: fixed;
  z-index: 1;
  top: 0;
  overflow-x: hidden;
  padding-top: 20px;
}

/* Control the left side */
.left {
  left: 0;
}

/* Control the right side */
.right {
  right: 0;
}

/* If you want the content centered horizontally and vertically */
.centered {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

/* Style the image inside the centered container, if needed */
.centered img {
  width: 150px;
  border-radius: 50%;
}

</style>
</head>
<body>

<h1>Marie Ilutuba</h1>
<p>
<a href="" target="_blank">Hinnakiri</a>
<a href="" target="_blank">Broneeri aeg</a>
</p>
<p>My first paragraph.</p>


<div class="split left">
  <div class="centered">
    <div class="carousel">
  <div class="carousel-inner" id="carouselInner">
    <div class="carousel-item active">
      <img src="ilutuba3.jpg" alt="Pilt 1">
    </div>
    <div class="carousel-item">
      <img src="ilutuba2.jpg" alt="Pilt 2">
    </div>
    <div class="carousel-item">
      <img src="ilutuba4.jpg" alt="Pilt 3">
    </div>
  </div>
  <button class="carousel-btn prev" onclick="changeSlide(-1)">&#10094;</button>
  <button class="carousel-btn next" onclick="changeSlide(1)">&#10095;</button>
</div>
    <img src="img_avatar2.png" alt="Avatar woman">
    <h2>Jane Flex</h2>
    <p>Some text.</p>
  </div>
</div>


<script>
    const inner = document.getElementById('carouselInner');
const items = document.querySelectorAll('.carousel-item');
let currentIndex = 0;

function updateCarousel() {
  inner.style.transform = `translateX(-${currentIndex * 100}%)`;
}

function changeSlide(direction) {
  currentIndex += direction;
  if (currentIndex < 0) {
    currentIndex = items.length - 1;
  } else if (currentIndex >= items.length) {
    currentIndex = 0;
  }
  updateCarousel();
}

setInterval(() => {
  changeSlide(1);
}, 4000);

</script>


</body>
</html>
